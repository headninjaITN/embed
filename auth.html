<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayane 🌸 03</title>
    <link rel="icon" type="image/svg+xml" href="https://static.wixstatic.com/shapes/c43f6e_4c566f5883d143ac8a72a2912ed9d296.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {},
            },
        }
    </script>
    <style>
        /* Custom transitions for smooth UI switching */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 400ms, transform 400ms; }
        .fade-exit { opacity: 1; }
        .fade-exit-active { opacity: 0; transition: opacity 300ms; }
        .hidden-view { display: none !important; }
    </style>
    <!-- Prevent FOUC (Flash of unstyled content) for Dark Mode -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen font-sans text-slate-800 dark:text-slate-200 flex items-center justify-center p-4 transition-colors duration-300">

    <!-- PERSISTENT TOP NAVIGATION -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-3">
        
        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="p-2.5 bg-white/90 dark:bg-slate-800/90 backdrop-blur shadow-md text-slate-700 dark:text-slate-300 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors focus:ring-4 focus:ring-slate-200 dark:focus:ring-slate-700 focus:outline-none">
            <!-- Dark icon (Moon) -->
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <!-- Light icon (Sun) -->
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>

        <!-- Auth Controls Button Bar (Hidden during login) -->
        <div id="auth-controls" class="hidden-view flex items-center gap-2">
            <!-- Tech Dojo Link -->
            <a href="https://help.itninjas.tech" target="_blank" class="px-4 py-2 text-sm bg-white/90 dark:bg-slate-800/90 backdrop-blur shadow-md text-slate-700 dark:text-slate-200 rounded-lg font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors focus:ring-4 focus:ring-slate-200 dark:focus:ring-slate-700 focus:outline-none flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-500 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Tech Dojo
            </a>
            
            <!-- Sign Out Button -->
            <button id="signout-btn" class="px-4 py-2 text-sm bg-white/90 dark:bg-slate-800/90 backdrop-blur shadow-md text-red-600 dark:text-red-400 rounded-lg font-medium border border-slate-200 dark:border-slate-700 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors focus:ring-4 focus:ring-slate-200 dark:focus:ring-slate-700 focus:outline-none flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
            </button>
        </div>
    </div>

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-transparent dark:border-slate-700 p-8 max-w-md w-full text-center transition-all duration-500 relative z-10">
        <div class="mb-8">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 transition-colors duration-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2 transition-colors duration-300">Welcome Back</h1>
            <p class="text-slate-500 dark:text-slate-400 transition-colors duration-300">Sign in to access your personalized assistant.</p>
        </div>

        <div class="space-y-3">
            <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg px-6 py-3 text-slate-700 dark:text-slate-200 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors focus:ring-4 focus:ring-slate-100 dark:focus:ring-slate-700 focus:outline-none">
                <svg class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </button>

            <button id="m365-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg px-6 py-3 text-slate-700 dark:text-slate-200 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/50 focus:outline-none">
                <svg class="w-5 h-5" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft 365
            </button>
        </div>
        
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-200 dark:border-slate-700 transition-colors duration-300"></div>
            <span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-500 text-sm transition-colors duration-300">Secured Gateway</span>
            <div class="flex-grow border-t border-slate-200 dark:border-slate-700 transition-colors duration-300"></div>
        </div>

        <p id="error-message" class="text-red-500 dark:text-red-400 text-sm mt-2 hidden-view"></p>
    </div>

    <!-- LOGGED IN DASHBOARD CONTAINER -->
    <div id="vf-container" class="hidden-view fixed inset-0 w-full h-full bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center z-0 transition-colors duration-300">
        <div class="text-center relative z-10">
            <div class="w-20 h-20 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm transition-colors duration-300">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 dark:text-white mb-3 transition-colors duration-300">Authentication Successful</h2>
            <p class="text-slate-500 dark:text-slate-400 text-lg max-w-md mx-auto transition-colors duration-300">Your session is secure. Your personalized assistant is opening in the corner of your screen.</p>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // 1. CONFIGURATION & API KEYS
        // ==========================================
        
        const VOICEFLOW_PROJECT_ID = '6acaa2745fadc33e2b04ee0f'; 
        const VOICEFLOW_VERSION_ID = 'production'; 

        const firebaseConfig = {
            apiKey: "AIzaSyAn9ytwWmsLF0lE8sa01b574CqBaVBgss4",
            authDomain: "vf-auth-8eae8.firebaseapp.com",
            projectId: "vf-auth-8eae8",
            storageBucket: "vf-auth-8eae8.firebasestorage.app",
            messagingSenderId: "88976083982",
            appId: "1:88976083982:web:6f09bc23eeefa50fc1805f"
        };

        // ==========================================
        // 2. INITIALIZATION (FIREBASE ONLY)
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            OAuthProvider, 
            signOut as firebaseSignOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        let auth;
        let activeUserSession = null;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            
            // Listen for existing sessions on page refresh
            onAuthStateChanged(auth, (firebaseUser) => {
                if (firebaseUser) {
                    // Extract the provider (Google or Microsoft) from the saved session
                    const providerId = firebaseUser.providerData.length > 0 
                        ? firebaseUser.providerData[0].providerId 
                        : 'firebase';
                    
                    // Push the restored user directly into our Voiceflow logic
                    handleAuthStateChanged({
                        uid: firebaseUser.uid,
                        displayName: firebaseUser.displayName,
                        email: firebaseUser.email,
                        provider: providerId
                    });
                }
            });
        } catch (err) {
            console.warn("Firebase not initialized. Check your config:", err);
        }

        // DOM Elements
        const loginContainer = document.getElementById('login-container');
        const vfContainer = document.getElementById('vf-container');
        const authControls = document.getElementById('auth-controls');
        
        const googleSignInBtn = document.getElementById('google-signin-btn');
        const m365SignInBtn = document.getElementById('m365-signin-btn');
        const signOutBtn = document.getElementById('signout-btn');
        const errorMessage = document.getElementById('error-message');
        
        const originalGoogleBtnHTML = googleSignInBtn.innerHTML;
        const originalM365BtnHTML = m365SignInBtn.innerHTML;

        // ==========================================
        // 3. UI & LOGIC
        // ==========================================

        // --- Dark Mode Logic ---
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        // Set initial icon
        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        // --- View Controller ---
        function showView(view) {
            if (view === 'login') {
                vfContainer.classList.add('hidden-view');
                authControls.classList.add('hidden-view');
                loginContainer.classList.remove('hidden-view');
                loginContainer.classList.add('fade-enter-active');
            } else if (view === 'app') {
                loginContainer.classList.add('hidden-view');
                vfContainer.classList.remove('hidden-view');
                authControls.classList.remove('hidden-view');
                vfContainer.classList.add('fade-enter-active');
                authControls.classList.add('fade-enter-active');
            }
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden-view');
            setTimeout(() => errorMessage.classList.add('hidden-view'), 5000);
        }

        function loadVoiceflowWidget(user) {
            if (document.getElementById('voiceflow-script')) return;
            console.log(`Initializing Voiceflow for ${user.provider} user:`, user.uid);

            const script = document.createElement('script');
            script.id = 'voiceflow-script';
            script.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
            script.type = "text/javascript";
            
            script.onload = function() {
                window.voiceflow.chat.load({
                    verify: { projectID: VOICEFLOW_PROJECT_ID },
                    url: 'https://general-runtime.voiceflow.com',
                    voice: {
                        url: 'https://runtime-api.voiceflow.com'
                    },
                    assistant: {
                        stylesheet: 'https://chat.itninjas.tech/ayane.css'
                    },
                    versionID: VOICEFLOW_VERSION_ID,
                    userID: user.uid, 
                    autostart: true,
                    launch: {
                        event: {
                            type: 'launch',
                            payload: {
                                userName: user.displayName,
                                email: user.email,
                                authProvider: user.provider
                            }
                        }
                    }
                }).then(() => {
                    window.voiceflow.chat.open();
                });
            };
            document.body.appendChild(script);
        }

        function removeVoiceflowWidget() {
            const script = document.getElementById('voiceflow-script');
            if (script) script.remove();
            
            const vfElements = document.querySelectorAll('#voiceflow-chat, div[class*="vfrc"]');
            vfElements.forEach(el => el.remove());
            
            if (window.voiceflow) delete window.voiceflow;
        }

        function handleAuthStateChanged(user) {
            activeUserSession = user;
            
            if (user) {
                showView('app');
                loadVoiceflowWidget(user);
            } else {
                showView('login');
                removeVoiceflowWidget();
            }
            
            googleSignInBtn.disabled = false;
            googleSignInBtn.innerHTML = originalGoogleBtnHTML;
            m365SignInBtn.disabled = false;
            m365SignInBtn.innerHTML = originalM365BtnHTML;
        }

        // ==========================================
        // 4. AUTHENTICATION HANDLERS
        // ==========================================

        googleSignInBtn.addEventListener('click', async () => {
            googleSignInBtn.disabled = true;
            googleSignInBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting to Google...`;

            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                
                handleAuthStateChanged({
                    uid: result.user.uid,
                    displayName: result.user.displayName,
                    email: result.user.email,
                    provider: 'google'
                });
            } catch (error) {
                console.error(error);
                showError(error.message);
                googleSignInBtn.disabled = false;
                googleSignInBtn.innerHTML = originalGoogleBtnHTML;
            }
        });

        m365SignInBtn.addEventListener('click', async () => {
            m365SignInBtn.disabled = true;
            m365SignInBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting to M365...`;

            try {
                const provider = new OAuthProvider('microsoft.com');
                provider.setCustomParameters({ prompt: 'select_account' });
                
                const result = await signInWithPopup(auth, provider);
                
                handleAuthStateChanged({
                    uid: result.user.uid,
                    displayName: result.user.displayName,
                    email: result.user.email,
                    provider: 'microsoft.com'
                });
            } catch (error) {
                console.error(error);
                showError("Microsoft Login failed. Ensure 'microsoft.com' provider is enabled in Firebase Console.");
                m365SignInBtn.disabled = false;
                m365SignInBtn.innerHTML = originalM365BtnHTML;
            }
        });

        signOutBtn.addEventListener('click', async () => {
            const originalText = signOutBtn.innerHTML;
            signOutBtn.innerHTML = `<svg class="animate-spin w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Signing out...`;
            
            if (activeUserSession) {
                try {
                    await firebaseSignOut(auth);
                } catch (error) {
                    console.error("Logout error", error);
                }
            }
            
            signOutBtn.innerHTML = originalText;
            handleAuthStateChanged(null);
        });

    </script>
</body>
</html>
