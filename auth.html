<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M365 Voiceflow Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom transitions for smooth UI switching */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 400ms, transform 400ms; }
        .fade-exit { opacity: 1; }
        .fade-exit-active { opacity: 0; transition: opacity 300ms; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center transition-all duration-500">
        <div class="mb-8">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h1>
            <p class="text-slate-500">Sign in to access your personalized assistant.</p>
        </div>

        <div class="space-y-3">
            <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 rounded-lg px-6 py-3 text-slate-700 font-medium hover:bg-slate-50 transition-colors focus:ring-4 focus:ring-slate-100 focus:outline-none">
                <svg class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </button>

            <button id="m365-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 rounded-lg px-6 py-3 text-slate-700 font-medium hover:bg-slate-50 transition-colors focus:ring-4 focus:ring-blue-100 focus:outline-none">
                <svg class="w-5 h-5" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft 365
            </button>
        </div>
        
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink-0 mx-4 text-slate-400 text-sm">Secured Gateway</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <p id="error-message" class="text-red-500 text-sm mt-2 hidden-view"></p>
    </div>

    <!-- FULL SCREEN VOICEFLOW CONTAINER -->
    <div id="vf-container" class="hidden-view fixed inset-0 w-full h-full bg-white z-40"></div>

    <!-- FLOATING AUTH CONTROLS -->
    <div id="auth-controls" class="hidden-view fixed top-4 right-4 z-50">
        <button id="signout-btn" class="px-4 py-2 bg-white/90 backdrop-blur shadow-md text-slate-700 rounded-lg font-medium border border-slate-200 hover:bg-slate-50 transition-colors focus:ring-4 focus:ring-slate-200 focus:outline-none flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Sign Out
        </button>
    </div>

    <script type="module">
        // ==========================================
        // 1. CONFIGURATION & API KEYS
        // ==========================================
        
        // Voiceflow Configuration
        const VOICEFLOW_PROJECT_ID = '6acaa2745fadc33e2b04ee0f'; 
        const VOICEFLOW_VERSION_ID = 'production'; // Use 'development' if testing un-published flows

        // Firebase Configuration (Used for both Google and Microsoft)
        const firebaseConfig = {
            apiKey: "AIzaSyAn9ytwWmsLF0lE8sa01b574CqBaVBgss4",
            authDomain: "vf-auth-8eae8.firebaseapp.com",
            projectId: "vf-auth-8eae8",
            storageBucket: "vf-auth-8eae8.firebasestorage.app",
            messagingSenderId: "88976083982",
            appId: "1:88976083982:web:6f09bc23eeefa50fc1805f"
        };

        // ==========================================
        // 2. INITIALIZATION (FIREBASE ONLY)
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            OAuthProvider, 
            signOut as firebaseSignOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        let auth;
        let activeUserSession = null;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
        } catch (err) {
            console.warn("Firebase not initialized. Check your config:", err);
        }

        // DOM Elements
        const loginContainer = document.getElementById('login-container');
        const vfContainer = document.getElementById('vf-container');
        const authControls = document.getElementById('auth-controls');
        const googleSignInBtn = document.getElementById('google-signin-btn');
        const m365SignInBtn = document.getElementById('m365-signin-btn');
        const signOutBtn = document.getElementById('signout-btn');
        const errorMessage = document.getElementById('error-message');
        
        const originalGoogleBtnHTML = googleSignInBtn.innerHTML;
        const originalM365BtnHTML = m365SignInBtn.innerHTML;

        // ==========================================
        // 3. UI & VOICEFLOW LOGIC
        // ==========================================
        function showView(view) {
            if (view === 'login') {
                vfContainer.classList.add('hidden-view');
                authControls.classList.add('hidden-view');
                loginContainer.classList.remove('hidden-view');
                loginContainer.classList.add('fade-enter-active');
            } else if (view === 'app') {
                loginContainer.classList.add('hidden-view');
                vfContainer.classList.remove('hidden-view');
                authControls.classList.remove('hidden-view');
                vfContainer.classList.add('fade-enter-active');
                authControls.classList.add('fade-enter-active');
            }
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden-view');
            setTimeout(() => errorMessage.classList.add('hidden-view'), 5000);
        }

        function loadVoiceflowWidget(user) {
            if (document.getElementById('voiceflow-script')) return;
            console.log(`Initializing Voiceflow for ${user.provider} user:`, user.uid);

            const script = document.createElement('script');
            script.id = 'voiceflow-script';
            script.src = "https://cdn.voiceflow.com/widget/bundle.mjs";
            script.type = "text/javascript";
            
            script.onload = function() {
                window.voiceflow.chat.load({
                    verify: { projectID: VOICEFLOW_PROJECT_ID },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: VOICEFLOW_VERSION_ID,
                    userID: user.uid, // Unified Firebase UID ensures consistent sessions
                    render: {
                        mode: 'embedded',
                        target: document.getElementById('vf-container')
                    },
                    autostart: true,
                    launch: {
                        event: {
                            type: 'launch',
                            payload: {
                                userName: user.displayName,
                                email: user.email,
                                authProvider: user.provider
                                // Note: We are no longer passing complex access tokens here
                                // as API tasks are offloaded to specialized VF playbooks.
                            }
                        }
                    }
                });
            };
            document.body.appendChild(script);
        }

        function removeVoiceflowWidget() {
            const script = document.getElementById('voiceflow-script');
            if (script) script.remove();
            
            const vfContainerElement = document.getElementById('vf-container');
            if (vfContainerElement) vfContainerElement.innerHTML = '';
            
            const vfElements = document.querySelectorAll('#voiceflow-chat, div[class*="vfrc"]');
            vfElements.forEach(el => el.remove());
            
            if (window.voiceflow) delete window.voiceflow;
        }

        function handleAuthStateChanged(user) {
            activeUserSession = user;
            
            if (user) {
                showView('app');
                loadVoiceflowWidget(user);
            } else {
                showView('login');
                removeVoiceflowWidget();
            }
            
            // Reset buttons
            googleSignInBtn.disabled = false;
            googleSignInBtn.innerHTML = originalGoogleBtnHTML;
            m365SignInBtn.disabled = false;
            m365SignInBtn.innerHTML = originalM365BtnHTML;
        }

        // ==========================================
        // 4. AUTHENTICATION HANDLERS
        // ==========================================

        // --- GOOGLE SIGN IN ---
        googleSignInBtn.addEventListener('click', async () => {
            googleSignInBtn.disabled = true;
            googleSignInBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting to Google...`;

            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                
                handleAuthStateChanged({
                    uid: result.user.uid,
                    displayName: result.user.displayName,
                    email: result.user.email,
                    provider: 'google'
                });
            } catch (error) {
                console.error(error);
                showError(error.message);
                googleSignInBtn.disabled = false;
                googleSignInBtn.innerHTML = originalGoogleBtnHTML;
            }
        });

        // --- MICROSOFT 365 SIGN IN (VIA FIREBASE) ---
        m365SignInBtn.addEventListener('click', async () => {
            m365SignInBtn.disabled = true;
            m365SignInBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connecting to M365...`;

            try {
                // We use OAuthProvider explicitly targeting Microsoft
                const provider = new OAuthProvider('microsoft.com');
                
                // Optional: Force user to select an account if they have multiple
                provider.setCustomParameters({
                    prompt: 'select_account'
                });
                
                const result = await signInWithPopup(auth, provider);
                
                handleAuthStateChanged({
                    uid: result.user.uid, // Unified Firebase UID!
                    displayName: result.user.displayName,
                    email: result.user.email,
                    provider: 'microsoft.com'
                });
            } catch (error) {
                console.error(error);
                showError("Microsoft Login failed. Ensure 'microsoft.com' provider is enabled in Firebase Console.");
                m365SignInBtn.disabled = false;
                m365SignInBtn.innerHTML = originalM365BtnHTML;
            }
        });

        // --- SIGN OUT ---
        signOutBtn.addEventListener('click', async () => {
            signOutBtn.disabled = true;
            signOutBtn.textContent = 'Signing out...';
            
            if (activeUserSession) {
                try {
                    await firebaseSignOut(auth); // Firebase handles sign out for both providers uniformly
                } catch (error) {
                    console.error("Logout error", error);
                }
            }
            
            signOutBtn.disabled = false;
            signOutBtn.textContent = 'Sign Out';
            handleAuthStateChanged(null);
        });

    </script>
</body>
</html>
